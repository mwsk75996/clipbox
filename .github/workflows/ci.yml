name: CI

# Automatic CI runs are disabled until ready for distribution.
# Can only be manually triggered via workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  check:
    name: Check shared Rust core
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test shared Rust core
        run: cargo test -p clipbox-core
